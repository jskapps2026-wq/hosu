<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #07111f, #102a43);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .circle {
      position: absolute;
      width: 280px;
      height: 280px;
      background: rgba(0, 180, 255, 0.12);
      border-radius: 50%;
      filter: blur(5px);
      top: -80px;
      right: -100px;
    }

    .circle2 {
      position: absolute;
      width: 220px;
      height: 220px;
      background: rgba(0, 255, 170, 0.08);
      border-radius: 50%;
      bottom: -70px;
      left: -90px;
    }

    .logo {
      width: 105px;
      height: 105px;
      border-radius: 28px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
      font-size: 42px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 14px;
      font-weight: 800;
    }

    .subtitle {
      color: #b8c7d9;
      font-size: 16px;
      line-height: 1.6;
      max-width: 330px;
      margin-bottom: 38px;
    }

    .btn {
      width: 100%;
      max-width: 330px;
      padding: 17px 20px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #00bfff, #0077ff);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,130,255,0.3);
      transition: 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .terms {
      margin-top: 22px;
      font-size: 12px;
      color: #7f93aa;
    }

    .terms span {
      color: #b9c9da;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="circle"></div>
    <div class="circle2"></div>

    <div class="logo">
      🚀
    </div>

    <h1>Welcome!</h1>

    <p class="subtitle">
      Welcome to our app. Enjoy a simple, fast and amazing experience.
      Let's get started.
    </p>

    <button class="btn" onclick="startApp()">
      Get Started
    </button>

    <p class="terms">
      By continuing, you agree to our <span>Terms & Privacy Policy</span>.
    </p>

  </div>

  <script>
    function startApp() {
      // Yahan apna next page set karein
      window.location.href = "home.html";
    }
  </script>

</body>
</html>
